services:
  autobanner:
    build:
      context: ./backend
      args:
        WITH_AI: "false"   # set to "true" for CLIP/LaMa (large image)
    image: autobanner:latest
    ports:
      - "7860:7860"
    environment:
      AUTOBANNER_LOG_LEVEL: INFO
      # Comma-separated keys. Leave empty only on a trusted network.
      AUTOBANNER_API_KEYS: ${AUTOBANNER_API_KEYS:-}
      AUTOBANNER_WORKERS: ${AUTOBANNER_WORKERS:-2}
      AUTOBANNER_RATE_LIMIT_PER_MINUTE: ${AUTOBANNER_RATE_LIMIT_PER_MINUTE:-60}
      AUTOBANNER_MAX_UPLOAD_MB: ${AUTOBANNER_MAX_UPLOAD_MB:-150}
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - model-cache:/app/cache
      - autobanner-data:/data   # job results (AUTOBANNER_DATA_DIR)
    read_only: true
    tmpfs:
      - /tmp:size=2g
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  model-cache:
  autobanner-data:
