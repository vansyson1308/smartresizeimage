[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autobanner"
dynamic = ["version"]
description = "Resize one master banner into every ad and social size - brand-safe, budget-aware"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0,<12.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "opencv-python-headless>=4.5.0,<5.0.0",
    "psd-tools>=1.9.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Framework :: FastAPI",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0,<5.0.0",
    "simple-lama-inpainting>=0.1.0",
]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "httpx>=0.25.0", "ruff>=0.1.0", "mypy>=1.5.0"]

[project.scripts]
autobanner = "app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests that load AI models (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring full pipeline",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
