services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - model-cache:/app/cache
    environment:
      - AUTOBANNER_LOG_LEVEL=INFO
      - AUTOBANNER_USE_AI=false
      - AUTOBANNER_DATA_DIR=/app/data
      # Local users and sessions (first run: POST /api/auth/setup or the UI's setup
      # screen with the setup token below or the one printed in the logs)
      - AUTOBANNER_AUTH=local
      # - AUTOBANNER_SETUP_TOKEN=change-me
      # Air-gapped installs: refuse outbound connections at the socket level
      # - AUTOBANNER_OFFLINE=1
      # Plans: AUTOBANNER_DEFAULT_PLAN=team or AUTOBANNER_WORKSPACE_PLANS=acme:team
      # Static keys for automation (optional, also work in local mode)
      # - AUTOBANNER_API_KEYS=change-me:workspace:editor

      # Gradio in Docker: bind externally
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860

      # IMPORTANT: bypass/disable proxy for localhost checks (fix "localhost not accessible")
      - NO_PROXY=localhost,127.0.0.1,0.0.0.0
      - no_proxy=localhost,127.0.0.1,0.0.0.0
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=

    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  model-cache:
